name: Publish TranscriptionCore
run-name: Publish ${{ inputs.version_bump }} TranscriptionCore

on:
  workflow_dispatch:
    inputs:
      version_bump:
        type: choice
        description: The type of bump to apply to the nuget package version
        required: true
        default: patch
        options:
        - major
        - minor
        - patch

jobs:
  create_release:
    if: github.ref == 'refs/heads/master'
    uses: ./.github/workflows/create_release.yml
    with:
      version_tag_regex: ^v(.*)$
      bump_level: ${{ inputs.version_bump }}

  publish:
    name: Publish TranscriptionCore
    needs: create_release
    runs-on: [self-hosted, cluster]
    permissions:
      contents: write
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Pack TranscriptionCore into a nuget package
      id: pack
      env:
        TRANSCRIPTION_CORE_NUGET_VERSION: ${{ needs.create_release.outputs.version_without_build }}
      run: |
        dotnet pack
        echo "nuget_package_path=bin/Release/beey.trsx.${{ env.TRANSCRIPTION_CORE_NUGET_VERSION }}.nupkg" >> "$GITHUB_OUTPUT"

    - name: Publish nuget package
      run: dotnet nuget push ${{ steps.pack.outputs.nuget_package_path }} --api-key ${{ secrets.NUGET_ORG_API_KEY }} --source 'https://api.nuget.org/v3/index.json'

    - name: Upload nuget package to release artifacts
      env:
        TAG: ${{ needs.create_release.outputs.tag }}
        NUGET_PACKAGE_PATH: ${{ steps.pack.outputs.nuget_package_path }}
      run: |
        upload_url=$(curl -sf \
          -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
          -H "Accept: application/vnd.github+json" \
          -H "X-GitHub-Api-Version: 2022-11-28" \
          "${{ github.api_url }}/repos/${{ github.repository }}/releases/tags/${TAG}" \
          | jq -r '.upload_url' | sed 's/{[^}]*}//')

        curl -sf \
          -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
          -H "Accept: application/vnd.github+json" \
          -H "X-GitHub-Api-Version: 2022-11-28" \
          -H "Content-Type: application/octet-stream" \
          --data-binary @"${NUGET_PACKAGE_PATH}" \
          "${upload_url}?name=$(basename "${NUGET_PACKAGE_PATH}")"
