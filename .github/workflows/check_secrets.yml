name: Scan secrets

on:
  pull_request:
  push:
    branches: ["master"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gitleaks:
    name: Scan current files and report Git history with Gitleaks
    runs-on: ubuntu-latest
    steps:
      - name: Check out the pull request head or triggering commit
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Scan current files and report historical findings
        shell: bash
        run: |
          set -euo pipefail

          version="8.30.1"
          archive="gitleaks_${version}_linux_x64.tar.gz"
          checksum="551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
          work_dir="$(mktemp -d "${RUNNER_TEMP}/gitleaks.XXXXXX")"
          trap 'rm -rf "${work_dir}"' EXIT
          mkdir "${work_dir}/ignore"
          curl --fail --silent --show-error --location \
            "https://github.com/gitleaks/gitleaks/releases/download/v${version}/${archive}" \
            --output "${work_dir}/${archive}"
          printf '%s  %s\n' "${checksum}" "${work_dir}/${archive}" | sha256sum --check --status
          tar --extract --gzip --file "${work_dir}/${archive}" --directory "${work_dir}" gitleaks

          cat > "${work_dir}/config.toml" <<'EOF'
          title = "Centrally managed Gitleaks default rules"

          [extend]
          useDefault = true
          EOF
          : > "${work_dir}/ignore/.gitleaksignore"

          mkdir "${work_dir}/snapshot"
          git archive HEAD | tar --extract --file - --directory "${work_dir}/snapshot"

          scan_config="${work_dir}/config.toml"

          scan() {
            local mode="$1" target="$2" report="$3" status=0
            shift 3
            "${work_dir}/gitleaks" "${mode}" \
              --config "${scan_config}" \
              --gitleaks-ignore-path "${work_dir}/ignore" \
              --ignore-gitleaks-allow \
              --redact=100 \
              --no-banner \
              --log-level error \
              --exit-code 10 \
              --report-format json \
              --report-path "${report}" \
              "$@" "${target}" > "${work_dir}/output.log" 2>&1 || status=$?

            if [[ "${status}" == 10 ]]; then
              if ! python3 - "${report}" "${mode}" "${target}" <<'PYREPORT'
          import json
          import os
          import sys

          with open(sys.argv[1]) as source:
              findings = json.load(source)
          if not findings:
              raise ValueError("Gitleaks reported findings but produced an empty report")
          for finding in findings:
              summary = {key: finding[key] for key in (
                  "RuleID", "File", "StartLine", "Commit"
              ) if key in finding}
              if sys.argv[2] == "dir":
                  summary["File"] = os.path.relpath(summary["File"], sys.argv[3])
              print(json.dumps(summary))
          PYREPORT
              then
                echo "Could not read Gitleaks findings; scanner output suppressed." >&2
                return 1
              fi
            elif [[ "${status}" != 0 ]]; then
              echo "Gitleaks failed with exit code ${status}; scanner output suppressed." >&2
            fi
            return "${status}"
          }

          echo "Scanning files in the current commit."
          current_status=0
          scan dir "${work_dir}/snapshot" "${work_dir}/current.json" || current_status=$?
          echo "Reporting findings from full Git history."
          historical_status=0
          scan git . "${work_dir}/history.json" --log-opts="--full-history --all -m" || historical_status=$?

          if [[ "${historical_status}" != 0 && "${historical_status}" != 10 ]]; then
            exit "${historical_status}"
          fi
          if [[ "${current_status}" != 0 && "${current_status}" != 10 ]]; then
            exit "${current_status}"
          fi
          if [[ "${current_status}" == 10 ]]; then
            echo "Secrets remain in the current repository files." >&2
            exit 1
          fi
          echo "No secrets found in current files; historical findings are informational."
